<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShortLink — URL Shortener & Analytics</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>

  <div class="container">
    <h1>🔗 ShortLink</h1>
    <p class="subtitle">Serverless URL shortener with real-time click analytics</p>

    <!-- Auth section -->
    <div id="auth-section">
      <div class="tabs">
        <button id="tab-login" class="tab active">Log In</button>
        <button id="tab-signup" class="tab">Sign Up</button>
      </div>

      <form id="login-form" class="auth-form">
        <input type="email" id="login-email" placeholder="Email" required />
        <input type="password" id="login-password" placeholder="Password" required />
        <button type="submit">Log In</button>
        <p class="error" id="login-error"></p>
      </form>

      <form id="signup-form" class="auth-form hidden">
        <input type="email" id="signup-email" placeholder="Email" required />
        <input type="password" id="signup-password" placeholder="Password (min 8 chars, upper+lower+number)" required />
        <button type="submit">Sign Up</button>
        <p class="error" id="signup-error"></p>
      </form>

      <form id="confirm-form" class="auth-form hidden">
        <p>Check your email for a confirmation code.</p>
        <input type="text" id="confirm-code" placeholder="Confirmation code" required />
        <button type="submit">Confirm</button>
        <p class="error" id="confirm-error"></p>
      </form>
    </div>

    <!-- Dashboard section -->
    <div id="dashboard-section" class="hidden">
      <div class="dashboard-header">
        <span id="user-email"></span>
        <button id="logout-btn" class="link-btn">Log out</button>
      </div>

      <form id="create-url-form" class="create-form">
        <input type="url" id="long-url-input" placeholder="Paste a long URL to shorten..." required />
        <button type="submit">Shorten</button>
      </form>

      <ul id="urls-list" class="urls-list">
        <li class="loading">Loading your links...</li>
      </ul>
    </div>

    <!-- Analytics modal -->
    <div id="analytics-modal" class="modal hidden">
      <div class="modal-content">
        <button id="close-modal" class="close-btn">✕</button>
        <h2 id="analytics-title"></h2>
        <p id="analytics-total"></p>
        <canvas id="clicks-chart"></canvas>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
